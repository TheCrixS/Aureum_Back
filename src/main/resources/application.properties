# Aplicación
quarkus.application.name=Aureum
quarkus.application.version=1.0-SNAPSHOT

# HTTP
quarkus.http.port=8899
quarkus.http.host=localhost
quarkus.http.root-path=api
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=*
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.http.cors.headers=Content-Type,Authorization,X-Requested-With

# Base de datos
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=app_barberia_instancia_user
quarkus.datasource.password=lPsGWNtXkXdT9BFyZjXMf354qQKpcXXP
quarkus.datasource.jdbc.url=jdbc:postgresql://dpg-d7snkebbc2fs73cu0lv0-a.oregon-postgres.render.com:5432/app_barberia_instancia?sslmode=require

# Hibernate ORM
quarkus.hibernate-orm.schema-management.strategy=drop-and-create
