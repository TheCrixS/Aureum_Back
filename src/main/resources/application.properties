# Aplicación
quarkus.application.name=Aureum
quarkus.application.version=1.0-SNAPSHOT

# HTTP
quarkus.http.port=${PORT:8899}
quarkus.http.host=0.0.0.0
quarkus.http.root-path=api
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=${CORS_ORIGINS:*}
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.http.cors.headers=Content-Type,Authorization,X-Requested-With

# Base de datos
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USERNAME:app_barberia_instancia_user}
quarkus.datasource.password=${DB_PASSWORD:lPsGWNtXkXdT9BFyZjXMf354qQKpcXXP}
quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://dpg-d7snkebbc2fs73cu0lv0-a.oregon-postgres.render.com:5432/app_barberia_instancia?sslmode=require}

# Hibernate ORM
quarkus.hibernate-orm.schema-management.strategy=update
quarkus.hibernate-orm.log.sql=false

# Configuración de Logs
quarkus.log.level=INFO

# Logs de Consola
quarkus.log.console.enabled=true
quarkus.log.console.format=%d{yyyy-MM-dd HH:mm:ss,SSS} %-5p [%c{3.}] (%t) %s%e%n

# Logs de Archivo
quarkus.log.file.enabled=true
quarkus.log.file.path=logs/barbero.log
quarkus.log.file.format=%d{yyyy-MM-dd HH:mm:ss,SSS} %-5p [%c{3.}] (%t) %s%e%n
quarkus.log.file.rotation.max-file-size=5M
quarkus.log.file.rotation.max-backup-index=5
quarkus.log.file.rotation.file-suffix=yyyy-MM-dd
